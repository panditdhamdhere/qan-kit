name: Deploy to QAN testnet
description: Deploy a contract with qan-kit. Caches the amd64 qvmctl image on the runner.

inputs:
  contract:
    description: Path to the contract source, relative to the caller repo
    required: true
  name:
    description: Contract name passed to qvmctl -solidity.name
    required: true
  args:
    description: Comma-separated constructor args. qvmctl 0.1.0 currently ignores them.
    required: false
    default: ''
  private-key:
    description: Hex private key. Store it as a secret. It is not printed.
    required: true

outputs:
  address:
    description: Deployed contract address
    value: ${{ steps.deploy.outputs.address }}
  tx-hash:
    description: Deploy transaction hash
    value: ${{ steps.deploy.outputs.tx-hash }}

runs:
  using: composite
  steps:
    - name: Cache qvmctl image
      id: image-cache
      uses: actions/cache@v4
      with:
        path: /tmp/qvmctl.tar
        key: qvmctl-linux-amd64-latest

    - name: Load or pull qvmctl
      shell: bash
      run: |
        if [ -f /tmp/qvmctl.tar ]; then
          docker load -i /tmp/qvmctl.tar
        else
          docker pull --platform linux/amd64 qanplatform/qvmctl:latest
          docker save qanplatform/qvmctl:latest -o /tmp/qvmctl.tar
        fi

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build qan-kit
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: |
        pnpm install --frozen-lockfile
        pnpm build

    - name: Deploy
      id: deploy
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        QAN_PRIVATE_KEY: ${{ inputs.private-key }}
        QAN_DOCKER_PLATFORM: linux/amd64
      run: |
        set -euo pipefail
        ARGS=()
        if [ -n "${{ inputs.args }}" ]; then
          ARGS+=(--args "${{ inputs.args }}")
        fi
        RESULT="$(node "${{ github.action_path }}/../packages/cli/dist/index.js" --json deploy "${{ inputs.contract }}" --name "${{ inputs.name }}" "${ARGS[@]}")"
        echo "$RESULT"
        echo "address=$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.address)' "$RESULT")" >> "$GITHUB_OUTPUT"
        echo "tx-hash=$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(r.txHash)' "$RESULT")" >> "$GITHUB_OUTPUT"
